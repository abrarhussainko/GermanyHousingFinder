<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Germany Accommodation Finder & Auto German Message Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg"><i class="fa-solid fa-house-circle-check text-xl text-white"></i></div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Germany Housing Finder</h1>
      </div>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full"><i class="fa-solid fa-shield-check mr-1"></i> Anti-Scam Active</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Left Controls Panel -->
    <aside class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 space-y-6 h-fit">
      
      <div>
        <label class="text-sm font-semibold text-slate-300 block mb-2"><i class="fa-solid fa-user-tag mr-2 text-indigo-400"></i>Applicant Profile</label>
        <select id="userStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
          <option value="Working Professional">Working Professional</option>
          <option value="Student">University Student</option>
          <option value="Expat / Relocating">Expat / New Arrival</option>
          <option value="Family">Family</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Full Name</label>
          <input type="text" id="userName" value="Abrar Hussain" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1">Occupation</label>
          <input type="text" id="userOccupation" value="Engineer" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs">
        </div>
      </div>

      <hr class="border-slate-700/50">

      <div>
        <label class="text-sm font-semibold text-slate-300 block mb-2"><i class="fa-solid fa-location-dot mr-2 text-indigo-400"></i>Target City</label>
        <input type="text" id="cityInput" placeholder="e.g. Giessen, Frankfurt, Berlin..." value="Giessen" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
      </div>

      <div>
        <label class="text-sm font-semibold text-slate-300 block mb-2"><i class="fa-solid fa-building mr-2 text-indigo-400"></i>Housing Type</label>
        <select id="housingType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm">
          <option value="all">All Accommodation Types</option>
          <option value="wg">WG / Shared Apartment</option>
          <option value="single">Studio / 1-Room Flat</option>
          <option value="full">Private Full Apartment</option>
        </select>
      </div>

      <div>
        <div class="flex justify-between text-sm font-semibold text-slate-300 mb-2">
          <span>Max Monthly Rent</span>
          <span id="priceDisplay" class="text-indigo-400 font-bold">€600</span>
        </div>
        <input type="range" id="priceRange" min="200" max="2000" step="25" value="600" class="w-full accent-indigo-500 cursor-pointer" oninput="document.getElementById('priceDisplay').innerText = '€' + this.value">
      </div>

      <button onclick="performSearch()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-medium py-3 rounded-lg shadow-lg flex items-center justify-center space-x-2 transition">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Find Accommodation</span>
      </button>

    </aside>

    <!-- Right Results Grid -->
    <section class="lg:col-span-3 space-y-4">
      <div class="flex justify-between items-center bg-slate-800/40 p-3 border border-slate-700/50 rounded-lg">
        <span class="text-sm text-slate-400" id="resultCount">Loading listings...</span>
      </div>

      <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

  </main>

  <!-- Message Modal -->
  <div id="messageModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold text-indigo-400"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Auto German Application & English Translation</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-amber-400">German Message (Bewerbungstext)</span>
            <button onclick="copyToClipboard('germanText')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200"><i class="fa-regular fa-copy mr-1"></i>Copy</button>
          </div>
          <textarea id="germanText" readonly class="w-full h-72 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-200 font-mono"></textarea>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-cyan-400">English Translation</span>
            <button onclick="copyToClipboard('englishText')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200"><i class="fa-regular fa-copy mr-1"></i>Copy</button>
          </div>
          <textarea id="englishText" readonly class="w-full h-72 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-300 font-mono"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function performSearch() {
      const city = document.getElementById('cityInput').value;
      const maxPrice = document.getElementById('priceRange').value;
      const housingType = document.getElementById('housingType').value;

      const res = await fetch('/api/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ city, maxPrice, housingType })
      });

      const json = await res.json();
      document.getElementById('resultCount').innerText = `Found ${json.count} verified listings in ${city}`;

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = '';

      json.data.forEach(item => {
        grid.innerHTML += `
          <div class="bg-slate-800 border border-slate-700/80 rounded-xl overflow-hidden flex flex-col justify-between">
            <div>
              <img src="${item.images[0]}" class="h-44 w-full object-cover">
              <div class="p-4 space-y-2">
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-sm text-slate-100">${item.title}</h3>
                  <span class="text-indigo-400 font-extrabold text-base">€${item.price}/mo</span>
                </div>
                <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot mr-1"></i>${item.city} • ${item.size}</p>
                <p class="text-xs text-slate-300 line-clamp-2">${item.description}</p>
              </div>
            </div>
            <div class="p-4 pt-0 space-y-2">
              <button onclick="generateMessage('${item.title}')" class="w-full bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/30 text-xs py-2 rounded-lg font-medium transition">
                <i class="fa-solid fa-language mr-1"></i> Generate German Outreach Text
              </button>
              <a href="${item.sourceUrl}" target="_blank" class="block text-center text-xs text-slate-400 hover:text-white underline">
                View on ${item.source} <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i>
              </a>
            </div>
          </div>
        `;
      });
    }

    async function generateMessage(listingTitle) {
      const city = document.getElementById('cityInput').value;
      const name = document.getElementById('userName').value;
      const occupation = document.getElementById('userOccupation').value;
      const status = document.getElementById('userStatus').value;

      const res = await fetch('/api/generate-message', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, occupation, status, city, listingTitle })
      });

      const json = await res.json();
      document.getElementById('germanText').value = json.german;
      document.getElementById('englishText').value = json.english;
      document.getElementById('messageModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('messageModal').classList.add('hidden'); }
    function copyToClipboard(id) {
      const el = document.getElementById(id);
      el.select();
      document.execCommand('copy');
      alert('Copied to clipboard!');
    }

    performSearch();
  </script>
</body>
</html>
