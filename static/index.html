<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Germany Accommodation Finder & Message Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2 rounded-lg"><i class="fa-solid fa-house-circle-check text-xl text-white"></i></div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Germany Housing Finder</h1>
      </div>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full"><i class="fa-solid fa-shield-check mr-1"></i> Anti-Scam Active</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Left Input Controls (All Blank by Default) -->
    <aside class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 space-y-4 h-fit">
      
      <div class="border-b border-slate-700 pb-2">
        <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider"><i class="fa-solid fa-user mr-2"></i>Applicant Details</h2>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Full Name</label>
        <input type="text" id="userName" value="" placeholder="e.g. John Doe" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">Email</label>
          <input type="email" id="userEmail" value="" placeholder="name@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">Phone</label>
          <input type="text" id="userPhone" value="" placeholder="+49 123 45678" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Occupation / Program</label>
        <input type="text" id="userOccupation" value="" placeholder="e.g. Student at JLU / Developer" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Status</label>
        <select id="userStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
          <option value="Student">University Student</option>
          <option value="Working Professional">Working Professional</option>
          <option value="Expat / Relocating">Expat / New Arrival</option>
        </select>
      </div>

      <hr class="border-slate-700/50">

      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1"><i class="fa-solid fa-location-dot mr-1 text-indigo-400"></i>Target City</label>
        <input type="text" id="cityInput" value="" placeholder="e.g. Frankfurt, Giessen, Berlin..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100">
      </div>

      <div>
        <div class="flex justify-between text-xs font-semibold text-slate-300 mb-1">
          <span>Max Monthly Rent</span>
          <span id="priceDisplay" class="text-indigo-400 font-bold">€800</span>
        </div>
        <input type="range" id="priceRange" min="150" max="2500" step="25" value="800" class="w-full accent-indigo-500 cursor-pointer" oninput="document.getElementById('priceDisplay').innerText = '€' + this.value">
      </div>

      <button onclick="performSearch()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-medium py-2.5 rounded-lg text-xs flex items-center justify-center space-x-2 transition shadow-lg">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Search Accommodation</span>
      </button>

    </aside>

    <!-- Right Results Panel (Text Rows Only) -->
    <section class="lg:col-span-3 space-y-3">
      <div class="bg-slate-800/40 p-3 border border-slate-700/50 rounded-lg flex justify-between items-center">
        <span class="text-xs text-slate-300 font-medium" id="resultCount">Enter target city and details, then click "Search Accommodation"</span>
      </div>

      <div id="resultsList" class="space-y-3"></div>
    </section>

  </main>

  <!-- Message Generator Modal -->
  <div id="messageModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-sm font-bold text-indigo-400"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Tailored German Application Message</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-amber-400">German Message (Copy & Send)</span>
            <button onclick="copyToClipboard('germanText')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200"><i class="fa-regular fa-copy mr-1"></i>Copy</button>
          </div>
          <textarea id="germanText" readonly class="w-full h-80 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-200 font-mono"></textarea>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-cyan-400">English Translation</span>
            <button onclick="copyToClipboard('englishText')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-200"><i class="fa-regular fa-copy mr-1"></i>Copy</button>
          </div>
          <textarea id="englishText" readonly class="w-full h-80 bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-300 font-mono"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function performSearch() {
      const city = document.getElementById('cityInput').value.trim() || 'Frankfurt';
      const maxPrice = document.getElementById('priceRange').value;

      const res = await fetch('/api/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ city, maxPrice })
      });

      const json = await res.json();
      document.getElementById('resultCount').innerText = `Direct Live Housing Filters Ready for ${city} (Max €${maxPrice}/month)`;

      const list = document.getElementById('resultsList');
      list.innerHTML = '';

      json.data.forEach((item) => {
        list.innerHTML += `
          <div class="bg-slate-800 border border-slate-700/80 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="space-y-1">
              <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-0.5 rounded border border-indigo-500/20">${item.source}</span>
                <span class="text-xs font-bold text-emerald-400">${item.price_range}</span>
                <span class="text-[11px] text-slate-400">(${item.type})</span>
              </div>
              <h3 class="font-bold text-sm text-slate-100">${item.title}</h3>
              <p class="text-xs text-slate-300">${item.description}</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-2 shrink-0">
              <a href="${item.applyUrl}" target="_blank" rel="noopener noreferrer" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium text-xs px-4 py-2 rounded-lg transition text-center flex items-center justify-center space-x-1">
                <span>Open Portal Listings</span>
                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
              </a>

              <button onclick="generateMessage('${item.source}', '${item.title}')" class="bg-slate-700 hover:bg-slate-600 text-indigo-300 border border-indigo-500/30 text-xs px-3 py-2 rounded-lg font-medium transition text-center">
                <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Auto-Generate Message
              </button>
            </div>
          </div>
        `;
      });
    }

    async function generateMessage(source, title) {
      const city = document.getElementById('cityInput').value.trim() || 'Germany';
      const name = document.getElementById('userName').value.trim();
      const email = document.getElementById('userEmail').value.trim();
      const phone = document.getElementById('userPhone').value.trim();
      const occupation = document.getElementById('userOccupation').value.trim();
      const status = document.getElementById('userStatus').value;

      const res = await fetch('/api/generate-message', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, email, phone, occupation, status, city, listingTitle: title, listingSource: source })
      });

      const json = await res.json();
      document.getElementById('germanText').value = json.german;
      document.getElementById('englishText').value = json.english;
      document.getElementById('messageModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('messageModal').classList.add('hidden'); }
    function copyToClipboard(id) {
      const el = document.getElementById(id);
      el.select();
      document.execCommand('copy');
      alert('Message copied to clipboard! You can now paste this on the portal page.');
    }
  </script>
</body>
</html>
